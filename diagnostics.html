<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='24' font-size='24'%3E🧪%3C/text%3E%3C/svg%3E"><title>Taipei Run — Body Worker Diagnostics</title><style>body{background:#102a2d;color:#eff6dc;font:15px/1.8 system-ui;padding:35px;max-width:900px;margin:auto}h1{color:#e8fc86}button{padding:13px 24px;font:700 16px system-ui;background:#e8fc86;color:#17342c;border:0;border-radius:5px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;background:#092024;padding:20px;border:1px solid #73978d;border-radius:5px}#status{font-size:20px;color:#e8fc86}small{color:#adc6b7}a{color:#e8fc86}</style></head><body><h1>Body Worker 實際載入驗證</h1><p>載入專案的本地模型與 WASM，送出一張 64 × 64 空白圖片，檢查 Worker 是否完成推論。這個頁面不會請求 Camera 權限。</p><button id="run">驗證模型與空白 frame 推論</button><p id="status">尚未執行</p><pre id="result">等待執行。</pre><small>通過只代表 WASM／模型／Worker 能執行，不代表真人辨識已驗證。</small><p><a href="/">回到 Taipei Run</a></p><script type="module" src="/src/diagnostics.ts"></script></body></html>
